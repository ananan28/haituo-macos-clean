name: Viber personal Windows client probe - no release
on:
  push:
    branches: ['spike/viber-personal-desktop']
    paths: ['.github/workflows/viber-windows-client.yml']
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Install signed official Viber MSI in ephemeral runner
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'Viber29.msi'
          Invoke-WebRequest 'https://download.cdn.viber.com/desktop/windows/29.1.0/ViberSetup.msi' -OutFile $msi
          $sig = Get-AuthenticodeSignature $msi
          Write-Host ("MSI-signature=" + $sig.Status)
          if ($sig.SignerCertificate) { Write-Host ("MSI-signer=" + $sig.SignerCertificate.Subject) }
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Viber') { throw 'MSI publisher signature invalid' }
          $install = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          Write-Host ("Installer-exit=" + $install.ExitCode)
          if ($install.ExitCode -notin @(0,3010)) { throw 'MSI install failed' }
          $roots = @((Join-Path $env:LOCALAPPDATA 'Viber'), (Join-Path $env:ProgramFiles 'Viber'), (Join-Path ${env:ProgramFiles(x86)} 'Viber'))
          $exe = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem -Path $_ -Filter 'Viber.exe' -File -Recurse -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $exe) { throw 'Installed Viber.exe not found in expected locations' }
          $exeSig=Get-AuthenticodeSignature $exe.FullName
          Write-Host ("Client-signature=" + $exeSig.Status + "; version=" + $exe.VersionInfo.ProductVersion)
          if ($exeSig.Status -ne 'Valid') { throw 'Installed client signature invalid' }
          $before = @(Get-Process -Name Viber -ErrorAction SilentlyContinue)
          Write-Host ("Existing-Viber-processes=" + $before.Count)
          if ($before.Count -eq 0) { Start-Process -FilePath $exe.FullName | Out-Null }
          Start-Sleep -Seconds 15
          $candidates=@(Get-Process -Name Viber -ErrorAction SilentlyContinue)
          Write-Host ("Viber-processes=" + $candidates.Count)
          foreach($p in $candidates){ Write-Host ("pid="+$p.Id+" handle="+$p.MainWindowHandle+" responding="+$p.Responding) }
          if ($candidates.Count -eq 0) { throw 'No Viber client process remained running' }
          $process=$candidates | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          if (-not $process) { throw 'Viber has no detected top-level window' }
          Add-Type -AssemblyName UIAutomationClient
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$process.Id)
          $found=$root.FindAll([System.Windows.Automation.TreeScope]::Children,$condition)
          Write-Host ("UIA top-level window count=" + $found.Count)
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ViberProbe {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr SetParent(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] public static extern IntPtr GetParent(IntPtr h);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h,int x,int y,int w,int hgt,bool repaint);
          }
          '@
          $form=New-Object System.Windows.Forms.Form
          $form.Text='Disposable embedding probe'
          $form.ClientSize=New-Object System.Drawing.Size(1000,700)
          $form.Show()
          $hwnd=$process.MainWindowHandle
          $oldParent=[ViberProbe]::GetParent($hwnd)
          try {
            [void][ViberProbe]::SetParent($hwnd,$form.Handle)
            $parent=[ViberProbe]::GetParent($hwnd)
            Write-Host ("Windows-reparent-equal=" + ($parent -eq $form.Handle))
            if ($parent -ne $form.Handle) { throw 'SetParent did not attach Viber window' }
            [void][ViberProbe]::MoveWindow($hwnd,0,0,900,600,$true)
            Start-Sleep -Seconds 3
            $process.Refresh()
            Write-Host ("Client-responsive-after-reparent=" + $process.Responding)
            if (-not $process.Responding) { throw 'Viber became unresponsive after reparent' }
          } finally {
            [void][ViberProbe]::SetParent($hwnd,$oldParent)
            $form.Close()
          }
          Write-Host 'UNTESTED: login, personal messages, translation, real-account embedding and multi-account'
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
