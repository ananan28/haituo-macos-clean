name: Build desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --target ${{ matrix.target }} --test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haituo-${{ matrix.target }}
          path: |
            windows/out/*Setup.exe
            windows/verification/**
            macos/out/*.dmg
            macos/verification/**
