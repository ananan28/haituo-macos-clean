name: Build and verify macOS repairs
on:
  workflow_dispatch:
  push:
    branches: [fix/macos-startup-windows]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact uploaded baseline
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile
          m=json.loads(pathlib.Path('source-manifest.json').read_text())
          data=b''.join(pathlib.Path(p).read_bytes() for p in m['parts'])
          assert hashlib.sha256(data).hexdigest()==m['sha256']
          pathlib.Path('source.zip').write_bytes(data)
          with zipfile.ZipFile('source.zip') as z: z.extractall('.')
          PYCODE
      - name: Prepare missing packaging dependencies
        run: |
          mkdir -p macos/packaging-deps
          printf '{"private":true}\n' > macos/packaging-deps/package.json
          npm install --prefix macos/packaging-deps --ignore-scripts --no-audit --no-fund --save-exact tar@7.5.22
          python3 - <<'PYCODE'
          import pathlib
          p=pathlib.Path('macos/build-mac.command')
          text=p.read_text()
          marker='python3 macos/prepare-native.py\n'
          assert text.count(marker)==1, 'Unexpected baseline build script'
          text=text.replace(marker, marker+'mkdir -p macos/staging/app/node_modules/@signalapp/ringrtc/node_modules\ncp -R macos/packaging-deps/node_modules/. macos/staging/app/node_modules/@signalapp/ringrtc/node_modules/\n')
          text=text.replace(marker, marker+'python3 repair/prepare-repairs.py\n',1)
          text=text.replace('--app-version=1.1.8 --build-version=1.1.8','--app-version=1.1.22 --build-version=1.1.22 --icon=macos/haituo.icns')
          text=text.replace('海拓-1.1.8','海拓-1.1.22')
          sign='codesign --force --deep --sign - --entitlements macos/entitlements.plist "$APP"'
          assert text.count(sign)==1
          text=text.replace(sign,'python3 repair/prepare-account-helper.py "$APP"\n'+sign)
          create=next(line for line in text.splitlines() if line.startswith('hdiutil create '))
          text=text.replace(create,'for attempt in 1 2 3; do\n  if '+create+'; then break; fi\n  if [ \"$attempt\" = 3 ]; then exit 1; fi\n  sleep 2\ndone')
          p.write_text(text)
          PYCODE
      - name: Generate native macOS application icon
        run: |
          mkdir -p macos/haituo.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" work/app/build/icons/png/512x512.png --out "macos/haituo.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" work/app/build/icons/png/512x512.png --out "macos/haituo.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns macos/haituo.iconset -o macos/haituo.icns
      - name: Build repaired DMG
        run: bash macos/build-mac.command
      - name: Verify native startup and account windows
        run: python3 repair/test-runtime.py
      - name: Verify message translation, colors, and media layouts
        run: python3 repair/test-fixtures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haituo-repaired-1.1.22-ARM64
          retention-days: 7
          path: |
            macos/out/*.dmg
            macos/verification/*.json
            macos/verification/*.log
            macos/verification/*.png
          if-no-files-found: error
