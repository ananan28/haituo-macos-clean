<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui}body{cursor:crosshair;background:#111}#screen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#mask{position:absolute;inset:0;background:#0006;pointer-events:none}#selection{display:none;position:absolute;border:1px solid #ff5b5b;box-shadow:0 0 0 10000px #0006;cursor:move}#selection.active{display:block}#translation{position:absolute;inset:0;overflow:hidden;cursor:text}#translation[hidden]{display:none}.block{position:absolute;white-space:pre-wrap;overflow-wrap:anywhere;padding:2px;line-height:1.35;overflow:auto}#translation.flow{padding:10px;font-size:18px;line-height:1.5;white-space:pre-wrap;overflow:auto}#translation.compare{display:grid;grid-template-columns:1fr 1fr;padding:0;gap:0;background:#fff}.bilingual{min-width:0;overflow:auto;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5;border-right:1px solid #ddd}.bilingual strong{display:block;position:sticky;top:0;background:#fff;padding:0 0 8px;color:#52627a}.handle{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #ff5b5b;border-radius:50%;z-index:5}.handle[data-h=nw]{left:-5px;top:-5px;cursor:nwse-resize}.handle[data-h=n]{left:50%;top:-5px;cursor:ns-resize}.handle[data-h=ne]{right:-5px;top:-5px;cursor:nesw-resize}.handle[data-h=e]{right:-5px;top:50%;cursor:ew-resize}.handle[data-h=se]{right:-5px;bottom:-5px;cursor:nwse-resize}.handle[data-h=s]{left:50%;bottom:-5px;cursor:ns-resize}.handle[data-h=sw]{left:-5px;bottom:-5px;cursor:nesw-resize}.handle[data-h=w]{left:-5px;top:50%;cursor:ew-resize}#toolbar{display:none;position:fixed;z-index:20;align-items:center;gap:6px;max-width:calc(100vw - 16px);padding:8px 10px;border-radius:9px;background:#25282f;color:#fff;box-shadow:0 5px 22px #0005;cursor:default;flex-wrap:wrap}button{font:inherit;border:0;border-radius:5px;padding:7px 10px;color:white;background:#404752;cursor:pointer;white-space:nowrap}button:hover{background:#566170}button:disabled{opacity:.4;cursor:default}#translate{background:#e74b4b}#status{max-width:420px;font-size:12px;line-height:1.4;overflow-wrap:anywhere}#hint{position:fixed;left:18px;top:15px;background:#222b;color:white;border-radius:7px;padding:10px 14px;pointer-events:none}#working{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff9;color:#173354;pointer-events:none;text-shadow:0 1px white;font-size:16px}#working[hidden]{display:none}
</style></head><body><img id="screen" alt="屏幕截图"><div id="mask"></div><div id="selection"><div id="translation" hidden></div><div id="working" hidden>正在翻译…</div><i class="handle" data-h="nw"></i><i class="handle" data-h="n"></i><i class="handle" data-h="ne"></i><i class="handle" data-h="e"></i><i class="handle" data-h="se"></i><i class="handle" data-h="s"></i><i class="handle" data-h="sw"></i><i class="handle" data-h="w"></i></div><div id="toolbar"><span id="status">框选文字后自动翻译</span><button id="translate">翻译</button><button id="original" disabled>原图</button><button id="translated" disabled>译文</button><button id="compare" disabled>双语对照</button><button id="copy" disabled>复制译文</button><button id="reset">重新框选</button><button id="close">关闭</button></div><div id="hint">拖动框选 · 可调整边框或移动选区 · Esc 退出</div><script>
const api=window.haituoScreenshot,box=document.getElementById('selection'),layer=document.getElementById('translation'),bar=document.getElementById('toolbar'),status=document.getElementById('status'),working=document.getElementById('working');let rect=null,drag=null,requestId=0,result=null;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function position(){if(!rect)return;Object.assign(box.style,{left:rect.x+'px',top:rect.y+'px',width:rect.width+'px',height:rect.height+'px'});box.classList.add('active');bar.style.display='flex';bar.style.left=clamp(rect.x,8,innerWidth-bar.offsetWidth-8)+'px';bar.style.top=clamp(rect.y+rect.height+12,8,innerHeight-bar.offsetHeight-8)+'px'}
function clearResult(){requestId++;result=null;layer.hidden=true;layer.replaceChildren();working.hidden=true;for(const id of ['original','translated','compare','copy'])document.getElementById(id).disabled=true}
function translate(){if(!rect||rect.width<8||rect.height<8)return;clearResult();working.hidden=false;status.textContent='正在识别并翻译…';api.select({...rect,requestId}).catch(error=>{working.hidden=true;status.textContent='调用失败，请重新框选或检查接口'});}
function render(mode='compare'){if(!result)return;layer.hidden=mode==='original';layer.className=mode==='compare'?'compare':'';layer.replaceChildren();if(mode==='original')return;if(mode==='compare'){for(const [title,text] of [['原文',result.original],['译文',result.translation]]){const el=document.createElement('div');el.className='bilingual';const heading=document.createElement('strong');heading.textContent=title;el.append(heading,document.createTextNode(text));layer.append(el)}return}layer.style.background=result.background||'#fff';layer.style.color=result.foreground||'#171717';const blocks=result.blocks||[];if(blocks.length){for(const block of blocks){const el=document.createElement('div');el.className='block';el.textContent=block.translation;Object.assign(el.style,{left:block.x/10+'%',top:block.y/10+'%',width:block.width/10+'%',height:block.height/10+'%',background:result.background||'#fff',fontSize:clamp(rect.height*block.height/1000*.7,11,24)+'px'});layer.append(el);let size=parseFloat(el.style.fontSize);while(el.scrollHeight>el.clientHeight+2&&size>10){size--;el.style.fontSize=size+'px'}}}else{layer.className+=' flow';layer.textContent=result.translation}}
addEventListener('pointerdown',e=>{if(e.button!==0||bar.contains(e.target))return;const handle=e.target.dataset.h,inside=rect&&box.contains(e.target);if(layer.contains(e.target)&&result&&!handle)return;clearResult();drag={x:e.clientX,y:e.clientY,old:rect?{...rect}:null,type:handle|| (inside?'move':'new')};if(drag.type==='new')rect={x:e.clientX,y:e.clientY,width:0,height:0};document.getElementById('mask').style.display='none';document.body.setPointerCapture(e.pointerId);e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag)return;const x=clamp(e.clientX,0,innerWidth),y=clamp(e.clientY,0,innerHeight),dx=x-drag.x,dy=y-drag.y;if(drag.type==='new')rect={x:Math.min(drag.x,x),y:Math.min(drag.y,y),width:Math.abs(x-drag.x),height:Math.abs(y-drag.y)};else if(drag.type==='move')rect={...drag.old,x:clamp(drag.old.x+dx,0,innerWidth-drag.old.width),y:clamp(drag.old.y+dy,0,innerHeight-drag.old.height)};else{let l=drag.old.x,t=drag.old.y,r=l+drag.old.width,b=t+drag.old.height;if(drag.type.includes('w'))l=x;if(drag.type.includes('e'))r=x;if(drag.type.includes('n'))t=y;if(drag.type.includes('s'))b=y;rect={x:Math.min(l,r),y:Math.min(t,b),width:Math.abs(r-l),height:Math.abs(b-t)}}position()});
addEventListener('pointerup',()=>{if(!drag)return;drag=null;if(rect.width>=8&&rect.height>=8){position();translate()}else{box.classList.remove('active');bar.style.display='none';rect=null}});
document.getElementById('translate').onclick=translate;document.getElementById('original').onclick=()=>render('original');document.getElementById('translated').onclick=()=>render('translated');document.getElementById('compare').onclick=()=>render('compare');document.getElementById('copy').onclick=()=>result&&api.copy(result.translation);document.getElementById('reset').onclick=()=>{clearResult();rect=null;box.classList.remove('active');bar.style.display='none';document.getElementById('mask').style.display='block'};document.getElementById('close').onclick=()=>api.cancel();addEventListener('keydown',e=>{if(e.key==='Escape')api.cancel()});
api.onResult(data=>{if(data.type==='capture'){document.getElementById('screen').src=data.image;return}if(data.requestId!==requestId)return;status.textContent=data.status||'';if(data.translation){result=data;working.hidden=true;for(const id of ['original','translated','compare','copy'])document.getElementById(id).disabled=false;render()}else if(data.failed){working.hidden=true}position()});
</script></body></html>
